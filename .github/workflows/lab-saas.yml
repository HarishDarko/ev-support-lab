name: lab-saas

# One run per commit: pushes run only on main; branches run through their pull request.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lab-saas/**"
      - "gradle/**"
      - "gradlew"
      - "settings.gradle.kts"
      - ".github/workflows/lab-saas.yml"
      - ".github/scripts/regression-must-fail.sh"
      - "desk/src/data/experiment.saas-support.json"
  pull_request:
    paths:
      - "lab-saas/**"
      - "gradle/**"
      - "gradlew"
      - "settings.gradle.kts"
      - ".github/workflows/lab-saas.yml"
      - ".github/scripts/regression-must-fail.sh"
      - "desk/src/data/experiment.saas-support.json"

concurrency:
  group: lab-saas-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lab-saas:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      # Java 25 is the build's toolchain, so Gradle uses this JDK instead of provisioning another one.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      # Docker is available on the runner, so Testcontainers starts PostgreSQL itself.
      - name: Tests, including the experiment
        run: ./gradlew :lab-saas:test --console=plain
      # The desk shows the experiment from its own copy (desk/src/data/experiment.saas-support.json). A fresh run of the
      # experiment must equal it, so a change to the lab cannot leave the desk showing stale numbers. The copy once
      # went stale this way (an empty storyComparison), which hid a missing filter in the desk.
      - name: The desk's copy of the experiment matches a fresh run
        run: |
          fresh="$GITHUB_WORKSPACE/lab-saas/build/experiment-fresh.json"
          copy=desk/src/data/experiment.saas-support.json
          ./gradlew :lab-saas:run --args="experiment --out $fresh" --console=plain
          if ! diff <(jq -S . "$fresh") <(jq -S . "$copy"); then
            echo "::error::$copy differs from a fresh run of the experiment. Replace it with the run's output, printed below." >&2
            cat "$fresh"
            exit 1
          fi
          echo "The desk's copy matches a fresh run of the experiment."
      # With the fix off the regression test must fail, and fail in the right way: exactly these tests, each on an
      # assertion (org.opentest4j.AssertionFailedError), none errored or skipped. A Gradle or Docker error, a filter that
      # matches no test, one test passing, or a crash in place of an assertion fails this step. The step reads the test
      # report instead of the exit code (.github/scripts/regression-must-fail.sh).
      - name: The regression test fails without the fix
        run: |
          rm -rf lab-saas/build/test-results/test
          set +e
          ./gradlew :lab-saas:test --tests '*TokenStormRegressionTest' -Dlab.fix.enabled=false --console=plain
          set -e
          bash .github/scripts/regression-must-fail.sh \
            lab-saas/build/test-results/test/TEST-dev.saaslab.delivery.TokenStormRegressionTest.xml \
            org.opentest4j.AssertionFailedError \
            burstAtExpiryNeedsOneTokenAndDeliversEverything
