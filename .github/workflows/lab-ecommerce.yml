name: lab-ecommerce

# One run per commit: pushes run only on main; branches run through their pull request.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lab-ecommerce/**"
      - "gradle/**"
      - "gradlew"
      - "settings.gradle.kts"
      - ".github/workflows/lab-ecommerce.yml"
      - ".github/scripts/regression-must-fail.sh"
      - "desk/src/data/experiment.e-commerce.json"
  pull_request:
    paths:
      - "lab-ecommerce/**"
      - "gradle/**"
      - "gradlew"
      - "settings.gradle.kts"
      - ".github/workflows/lab-ecommerce.yml"
      - ".github/scripts/regression-must-fail.sh"
      - "desk/src/data/experiment.e-commerce.json"

concurrency:
  group: lab-ecommerce-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lab-ecommerce:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # The desk shows the experiment from its own copy. ExperimentStoryTest pins lab-ecommerce/experiment.json to a
      # fresh run, so the desk's copy must equal that file byte for byte.
      - name: The desk's copy of the experiment matches the lab's
        run: |
          if ! cmp lab-ecommerce/experiment.json desk/src/data/experiment.e-commerce.json; then
            diff lab-ecommerce/experiment.json desk/src/data/experiment.e-commerce.json || true
            echo "::error::desk/src/data/experiment.e-commerce.json differs from lab-ecommerce/experiment.json. Copy the lab's file over it." >&2
            exit 1
          fi
      # Java 25 is the build's toolchain, so Gradle uses this JDK instead of provisioning another one.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      # Docker is available on the runner, so Testcontainers starts PostgreSQL itself.
      - name: Tests, including the experiment
        run: ./gradlew :lab-ecommerce:test --console=plain
      - name: Failure messages and the experiment's output, when the tests fail
        if: failure()
        run: |
          grep -h -o '<failure message="[^"]*"' lab-ecommerce/build/test-results/test/*.xml | cut -c1-600 || true
          cat lab-ecommerce/build/experiment-computed.json || echo "the experiment did not finish"
      # With the fix off the regression test must fail, and fail in the right way: all three scenarios, each on an
      # assertion (org.opentest4j.AssertionFailedError), none errored or skipped. A Gradle or Docker error, a filter that
      # matches no test, a dropped or renamed scenario, one scenario passing, or a crash in place of an assertion fails
      # this step. The step reads the test report instead of the exit code (.github/scripts/regression-must-fail.sh).
      - name: The regression test fails without the fix
        run: |
          rm -rf lab-ecommerce/build/test-results/test
          set +e
          ./gradlew :lab-ecommerce:test --tests '*SecondAuthorizationRegressionTest' -Dlab.fix.enabled=false --console=plain
          set -e
          bash .github/scripts/regression-must-fail.sh \
            lab-ecommerce/build/test-results/test/TEST-dev.shoplab.checkout.SecondAuthorizationRegressionTest.xml \
            org.opentest4j.AssertionFailedError \
            slow-web-repay \
            slow-app-retry \
            app-race
