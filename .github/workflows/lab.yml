name: lab

# One run per commit: pushes run only on main; branches run through their pull request. The desk's copy of the
# experiment result is checked against a fresh run (ExperimentStoryTest), so a change to it runs the lab too.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "lab/**"
      - "gradle/**"
      - "gradlew"
      - "settings.gradle.kts"
      - "desk/src/data/experiment.json"
      - ".github/workflows/lab.yml"
      - ".github/scripts/regression-must-fail.sh"
  pull_request:
    paths:
      - "lab/**"
      - "gradle/**"
      - "gradlew"
      - "settings.gradle.kts"
      - "desk/src/data/experiment.json"
      - ".github/workflows/lab.yml"
      - ".github/scripts/regression-must-fail.sh"

concurrency:
  group: lab-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Java 25 is the build's toolchain, so Gradle uses this JDK instead of provisioning another one.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      # Docker is available on the runner, so Testcontainers starts PostgreSQL itself.
      - name: Tests, including the experiment
        run: ./gradlew :lab:test --console=plain
      # With the fix off the regression test must fail, and fail in the right way: exactly these tests, each on an
      # assertion (org.opentest4j.AssertionFailedError), none errored or skipped. A Gradle or Docker error, a filter that
      # matches no test, one test passing, or a crash in place of an assertion fails this step. The step reads the test
      # report instead of the exit code (.github/scripts/regression-must-fail.sh).
      - name: The regression test fails without the fix
        run: |
          rm -rf lab/build/test-results/test
          set +e
          ./gradlew :lab:test --tests '*StuckSessionRegressionTest' -Dlab.fix.enabled=false --console=plain
          set -e
          bash .github/scripts/regression-must-fail.sh \
            lab/build/test-results/test/TEST-dev.evlab.transaction.StuckSessionRegressionTest.xml \
            org.opentest4j.AssertionFailedError \
            late_ended_is_applied_and_closes_the_session_with_a_confirmed_invoice \
            lost_ended_is_reconciled_provisionally_at_the_last_meter_value
