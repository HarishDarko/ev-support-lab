# PostgreSQL for running the backend by hand (serve). Tests and the experiment start their own with Testcontainers.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lab
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
    ports:
      # Local demo only: listen on this machine, not on the network.
      - "127.0.0.1:5432:5432"
